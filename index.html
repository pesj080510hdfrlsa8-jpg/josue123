<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLO Ralph Lauren - Tienda Oficial</title>
<style>
body { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; background: #f0f8ff; color: #333; }
        header { background: #1e3a5f; color: #fff; padding: 18px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.4); position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; cursor: pointer; font-weight: 600; font-size: 28px; letter-spacing: 1.5px; user-select: none; color: #87ceeb; }
        header nav button { background: transparent; border: none; color: #fff; cursor: pointer; font-size: 24px; position: relative; transition: transform 0.3s ease; }
        header nav button:hover { transform: scale(1.15); }
        header nav button::after { content: attr(data-count); position: absolute; top: -9px; right: -14px; background: #4682b4; color: white; width: 20px; height: 20px; font-size: 12px; border-radius: 50%; text-align: center; line-height: 20px; font-weight: 600; display: none; }
        header nav button[data-count]:not([data-count="0"])::after { display: block; }
        main { padding: 0 40px 60px 40px; }
        #inicio { background: linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)), url('https://www.freelogovectors.net/wp-content/uploads/2023/08/ralph_lauren_logo-freelogovectors.net_.png') no-repeat center center/cover; height: 450px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-shadow: 2px 2px 12px rgba(255, 255, 255, 0.8); margin: 40px 0; border-radius: 12px; }
        #inicio h2 { font-size: 3.5em; margin: 0 0 15px; letter-spacing: 2px; }
        #inicio p { font-size: 1.7em; margin: 0 0 30px; font-weight: 500; }
        button { cursor: pointer; transition: background-color 0.3s ease, box-shadow 0.3s ease; }
        #inicio button { background: #4682b4; color: white; border: none; padding: 16px 45px; font-size: 1.2em; border-radius: 30px; font-weight: 600; box-shadow: 0 6px 12px rgba(70, 130, 180, 0.6); }
        #inicio button:hover { background: #36648b; box-shadow: 0 8px 20px rgba(54, 100, 139, 0.8); }
        #catalogo { display: none; margin-bottom: 40px; }
        #catalogo.active { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px 32px; }
        .producto { background: white; border-radius: 15px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); padding: 18px 15px 25px 15px; display: flex; flex-direction: column; align-items: center; transition: transform 0.3s ease, box-shadow 0.3s ease; border: 1px solid #e1f0ff; }
        .producto:hover { transform: translateY(-6px); box-shadow: 0 12px 22px rgba(70, 130, 180, 0.15); }
        .producto img { max-width: 100%; border-radius: 12px; object-fit: cover; height: 260px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.07); }
        .producto h3 { margin: 6px 0 8px; font-size: 20px; font-weight: 600; text-align: center; color: #1e3a5f; }
        .producto p { margin: 0 0 14px; font-weight: 700; color: #4682b4; font-size: 18px; }
        .producto button { padding: 12px 25px; background: #1e3a5f; color: white; border: none; border-radius: 30px; font-weight: 600; letter-spacing: 0.8px; box-shadow: 0 6px 12px rgba(30, 58, 95, 0.7); }
        .producto button:hover { background: #2c4f7c; box-shadow: 0 8px 18px rgba(44, 79, 124, 0.85); }
        #modalCarrito { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); justify-content: center; align-items: center; z-index: 1100; overflow-y: auto; padding: 20px; }
        #modalCarrito.active { display: flex; }
        .modal-content { background: white; padding: 35px 40px 40px 40px; width: 100%; max-width: 540px; border-radius: 18px; position: relative; box-shadow: 0 14px 32px rgba(0,0,0,0.22); font-size: 16px; border: 2px solid #e1f0ff; }
        .modal-content h2 { margin-top: 0; font-weight: 700; font-size: 28px; color: #1e3a5f; }
        .cerrar { position: absolute; top: 14px; right: 22px; cursor: pointer; font-size: 28px; font-weight: 700; color: #666; transition: color 0.3s ease; user-select: none; }
        .cerrar:hover { color: #4682b4; }
        .carrito-lista { max-height: 320px; overflow-y: auto; margin-bottom: 28px; border-top: 1px solid #e1f0ff; padding-top: 20px; }
        .carrito-item { display: flex; justify-content: space-between; margin-bottom: 14px; font-weight: 600; color: #1e3a5f; }
        .carrito-total { font-size: 22px; font-weight: 700; margin-bottom: 28px; color: #4682b4; border-top: 2px solid #4682b4; padding-top: 14px; }
        .btn-pagar { background: #4682b4; color: white; border: none; padding: 14px 0; border-radius: 35px; font-weight: 700; font-size: 18px; width: 100%; box-shadow: 0 8px 16px rgba(70, 130, 180, 0.7); }
        .btn-pagar:hover { background: #36648b; box-shadow: 0 10px 26px rgba(54, 100, 139, 0.85); }
        #formPago { display: none; flex-direction: column; }
        #formPago.active { display: flex; }
        #formPago label { margin: 12px 0 6px; font-weight: 600; color: #1e3a5f; }
        #formPago input, #formPago select { padding: 10px 14px; font-size: 15px; border-radius: 6px; border: 1.8px solid #e1f0ff; transition: border-color 0.3s ease; }
        #formPago input:focus, #formPago select:focus { border-color: #4682b4; outline: none; }
        #formPago button { margin-top: 22px; padding: 14px 0; background: #1e3a5f; color: white; border: none; border-radius: 35px; font-weight: 700; font-size: 18px; }
        #formPago button:hover { background: #2c4f7c; }
        #mensajeFinal { display: none; text-align: center; font-size: 22px; color: #4682b4; font-weight: 700; }
        #mensajeFinal.active { display: block; }
        @media(max-width: 1024px) { main { padding: 0 25px 50px 25px; } #catalogo.active { grid-template-columns: repeat(2, 1fr); } .producto img { height: 220px; } }
        @media(max-width: 600px) { #inicio h2 { font-size: 2.5em; } #inicio p { font-size: 1.3em; } #catalogo.active { grid-template-columns: 1fr; gap: 22px 20px; } .producto img { height: 260px; } }
</style>
</head>
<body>
    <header>
        <h1 id="logo">POLO Ralph Lauren</h1>
        <nav>
            <button id="carritoBtn" data-count="0" title="Ver carrito">🛒</button>
        </nav>
    </header>

    <main>
        <section id="inicio">
            <h2></h2>
            <p></p>
            <button id="btnVerCatalogo">Entrar</button>
        </section>

        <section id="catalogo"></section>
    </main>

    <div id="modalCarrito">
        <div class="modal-content">
            <span class="cerrar" id="cerrarModal">&times;</span>
            <h2>Tu Carrito</h2>
            <div class="carrito-lista" id="carritoLista"></div>
            <div class="carrito-total" id="carritoTotal">Total: $0</div>
            <button class="btn-pagar" id="btnPagar">Ir a pagar</button>

            <form id="formPago">
                <h3>Formulario de Pago</h3>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" required />
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" required />
                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" required />
                <label for="metodoPago">Método de pago:</label>
                <select id="metodoPago" required>
                    <option value="">Selecciona</option>
                    <option value="tarjeta">Tarjeta de crédito</option>
                    <option value="paypal">PayPal</option>
                    <option value="transferencia">Transferencia bancaria</option>
                </select>
                <button type="submit">Confirmar pago</button>
            </form>

            <div id="mensajeFinal">¡Gracias por tu compra, Te contactaremos pronto.</div>
        </div>
    </div>

    <script>
        const productos = [
            { id: 1, nombre: "Polo Básico Azul", precio: 89.99, imagen: "https://dtcralphlauren.scene7.com/is/image/PoloGSI/s7-1279327_alternate10?$plpDeskRF$" },
            { id: 2, nombre: "Polo Ralph Lauren Blanco", precio: 79.99, imagen: "https://media-cdn.placedestendances.com/image/86/7/7369867.jpg?fit=bounds&bg-color=FFFFFF&width=571&height=782&canvas=571-782" },
            { id: 3, nombre: "Polo Negro básico", precio: 99.99, imagen: "https://dtcralphlauren.scene7.com/is/image/PoloGSI/s7-1279324_alternate10?$plpDeskRF$" },
            { id: 4, nombre: "Polo Vino Básico", precio: 85.99, imagen: "https://ss261.liverpool.com.mx/xl/1158032780.jpg" },
            { id: 5, nombre: "Polo Verde Básico", precio: 89.99, imagen: "https://dtcralphlauren.scene7.com/is/image/PoloGSI/s7-1380559_alternate10?$plpDeskRF$" },
            { id: 6, nombre: " Camiseta Polo Gris", precio: 79.99, imagen: "https://dtcralphlauren.scene7.com/is/image/PoloGSI/s7-1369705_alternate10?$plpDeskRF$" },
            { id: 7, nombre: "Camiseta Polo Azul Marino", precio: 95.99, imagen: "https://m.media-amazon.com/images/I/71DTPNX32yL._AC_UY1000_.jpg" },
            { id: 8, nombre: "Polo Beige Básico", precio: 82.99, imagen: "https://img01.ztat.net/article/spp-media-p1/fc9592e0af544f2a85fdcd8477934efc/0cc90fc8d4494478809af3932099c94d.jpg?imwidth=1800" },
            { id: 9, nombre: "Polo Jersey Con Cremallera Corta", precio: 120.99, imagen: "https://media-cdn.placedestendances.com/image/40/1/7369401.jpg?fit=bounds&bg-color=F7F7F7&width=571&height=782&canvas=571-782" },
            { id: 10, nombre: "Polo Jersey Con Cremallera Corta ", precio: 125.99, imagen: "https://dtcralphlauren.scene7.com/is/image/PoloGSI/s7-AI785A87152004_alternate10?$plpDeskRF$" }
        ];

        let carrito = [];
        const productosContainer = document.getElementById("catalogo");
        const carritoBtn = document.getElementById("carritoBtn");
        const modalCarrito = document.getElementById("modalCarrito");
        const cerrarModal = document.getElementById("cerrarModal");
        const carritoLista = document.getElementById("carritoLista");
        const carritoTotal = document.getElementById("carritoTotal");
        const btnPagar = document.getElementById("btnPagar");
        const formPago = document.getElementById("formPago");
        const mensajeFinal = document.getElementById("mensajeFinal");
        const btnVerCatalogo = document.getElementById("btnVerCatalogo");
        const inicioSection = document.getElementById("inicio");
        const logo = document.getElementById("logo");

        function mostrarProductos() {
            productosContainer.innerHTML = "";
            productos.forEach(prod => {
                const div = document.createElement("div");
                div.classList.add("producto");
                div.innerHTML = `
                    <img src="${prod.imagen}" alt="${prod.nombre}" />
                    <h3>${prod.nombre}</h3>
                    <p>$${prod.precio.toFixed(2)}</p>
                    <button data-id="${prod.id}">Agregar al carrito</button>
                `;
                productosContainer.appendChild(div);
            });
        }

        function actualizarContador() {
            const count = carrito.reduce((acc, item) => acc + item.cantidad, 0);
            carritoBtn.setAttribute('data-count', count);
        }

        function mostrarCarrito() {
            carritoLista.innerHTML = "";
            if(carrito.length === 0) {
                carritoLista.innerHTML = "<p>El carrito está vacío</p>";
                btnPagar.style.display = "none";
                carritoTotal.textContent = "Total: $0";
                formPago.classList.remove("active");
                mensajeFinal.classList.remove("active");
                return;
            }
            btnPagar.style.display = "block";
            carrito.forEach(item => {
                const div = document.createElement("div");
                div.classList.add("carrito-item");
                div.innerHTML = `
                    <span>${item.nombre} x ${item.cantidad}</span>
                    <span>$${(item.precio * item.cantidad).toFixed(2)}</span>
                `;
                carritoLista.appendChild(div);
            });
            const total = carrito.reduce((acc, item) => acc + item.precio * item.cantidad, 0);
            carritoTotal.textContent = `Total: $${total.toFixed(2)}`;
            formPago.classList.remove("active");
            mensajeFinal.classList.remove("active");
        }

        function agregarAlCarrito(id) {
            const producto = productos.find(p => p.id === id);
            const existe = carrito.find(item => item.id === id);
            if(existe) {
                existe.cantidad++;
            } else {
                carrito.push({...producto, cantidad: 1});
            }
            actualizarContador();
        }

        productosContainer.addEventListener("click", e => {
            if(e.target.tagName === "BUTTON") {
                const id = parseInt(e.target.getAttribute("data-id"));
                agregarAlCarrito(id);
            }
        });

        carritoBtn.addEventListener("click", () => {
            mostrarCarrito();
            modalCarrito.classList.add("active");
        });

        cerrarModal.addEventListener("click", () => {
            modalCarrito.classList.remove("active");
            formPago.classList.remove("active");
            mensajeFinal.classList.remove("active");
        });

        btnPagar.addEventListener("click", () => {
            formPago.classList.add("active");
            btnPagar.style.display = "none";
        });

        formPago.addEventListener("submit", (e) => {
            e.preventDefault();
            carrito = [];
            actualizarContador();
            carritoLista.innerHTML = "";
            carritoTotal.textContent = "Total: $0";
            formPago.classList.remove("active");
            mensajeFinal.classList.add("active");
        });

        btnVerCatalogo.addEventListener("click", () => {
            inicioSection.style.display = "none";
            productosContainer.classList.add("active");
            mostrarProductos();
        });

        logo.addEventListener("click", () => {
            productosContainer.classList.remove("active");
            inicioSection.style.display = "flex";
        });
    </script>
</body>
</html>
